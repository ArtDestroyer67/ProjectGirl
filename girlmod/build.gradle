buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        // PINNED to 4.1.14 (not the floating 4.1.+). The floating latest
        // 4.1.x had a real Windows bug: MCPRepo.findRenames() writes a
        // TSRG file without creating its parent folder first, which throws
        // NoSuchFileException on Windows for both 'official' and 'snapshot'
        // mapping channels. 4.1.14 does not have this bug. Do not change
        // this back to a floating version without testing a full Windows
        // build first — see DEVELOPMENT.md for the full incident writeup.
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '4.1.14', changing: false
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '1.0.0'
group = 'com.girlmod'
archivesBaseName = 'girlmod'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

minecraft {
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                girlmod { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                girlmod { source sourceSets.main }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.34'

    // GeckoLib as local file — jar is in the libs/ folder
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'girlmod',
            'Specification-Vendor'    : 'girlmod',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'girlmod',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
